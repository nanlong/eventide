[package]
name = "eventide-macros"
description = "Procedural macros for the eventide DDD/CQRS toolkit: derive entities, entity ids, value objects and domain events with a single attribute."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/eventide-macros"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
# Path-only (no version) so cargo strips this from the published manifest.
# Otherwise `cargo publish -p eventide-macros` would refuse, because
# eventide-domain isn't on crates.io yet (chicken-and-egg: domain depends
# on macros, so macros must publish first).
eventide-domain = { path = "../eventide-domain" }
serde = { workspace = true }
trybuild = { workspace = true }
uuid = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
