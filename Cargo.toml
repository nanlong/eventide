[workspace]
members = [
    "eventide",
    "eventide-application",
    "eventide-domain",
    "eventide-macros",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["nanlong <nanlong.dev@gmail.com>"]
repository = "https://github.com/nanlong/eventide"
homepage = "https://github.com/nanlong/eventide"
documentation = "https://docs.rs/eventide"
readme = "README.md"
keywords = ["ddd", "cqrs", "event-sourcing", "hexagonal", "domain-driven-design"]
categories = ["data-structures", "asynchronous", "rust-patterns"]

[workspace.dependencies]
# Local crates (path + version so they can be published independently)
eventide-domain = { path = "eventide-domain", version = "0.1.0" }
eventide-application = { path = "eventide-application", version = "0.1.0" }
eventide-macros = { path = "eventide-macros", version = "0.1.0" }

# Shared third-party deps pinned at the workspace level so versions stay consistent.
anyhow = "1.0"
async-trait = "0.1"
bon = "3.7"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
futures-core = { version = "0.3", features = ["alloc"] }
futures-util = "0.3"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "uuid",
    "chrono",
] }
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
    "sync",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
trybuild = "1.0"
ulid = { version = "1.2", features = ["serde"] }
uuid = { version = "1.11", features = ["serde", "v4"] }

[profile.dev]
opt-level = 1
# https://davidlattimore.github.io/posts/2024/02/04/speeding-up-the-rust-edit-build-run-cycle.html
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
